name: Add new recipe

on:
  workflow_call:

jobs:
  create-recipe-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Recipe Name
        id: vars
        run: |
          # Extract "pizza" from "pizza #2"
          read -r RECIPE_NAME _ <<< "${{ github.event.issue.title }}"
          echo "filename=${RECIPE_NAME}.md" >> $GITHUB_OUTPUT

      - name: Format Recipe
        id: ai
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UNFORMATTED_RECIPE: ${{ github.event.issue.body }}
        run: |
          PAYLOAD=$(jq -n \
            --rawfile p "recipe-formatting-prompt.txt" \
            --arg r "$UNFORMATTED_RECIPE" \
            '{model: "deepseek-chat", messages: [{role: "system", content: $p}, {role: "user", content: $r}]}')
          
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/chat/completions" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "DeepSeek API Error: $(echo "$RESPONSE" | jq -r '.error.message')" >&2
            exit 1
          fi

          echo "Formatted recipe:"
          echo "$RESPONSE" | jq -r '.choices[0].message.content' | tee "${{ steps.vars.outputs.filename }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="recipe/${{ steps.vars.outputs.filename }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -b "$BRANCH_NAME"
          mv "${{ steps.vars.outputs.filename }}" "recipes/${{ steps.vars.outputs.filename }}"
          
          git add "recipes/${{ steps.vars.outputs.filename }}"
          git commit -m "chore: add recipe ${{ steps.vars.outputs.filename }}"
          git push origin "$BRANCH_NAME" --force
          
          gh pr create \
            --title "New Recipe: ${{ steps.vars.outputs.filename }}" \
            --body "Closes #${{ github.event.issue.number }}." \
            --base main \
            --head "$BRANCH_NAME" || true
